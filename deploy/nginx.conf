# Gravekeeper: nginx site config. See deploy/DEPLOY.md.
# Replace gravekeeper.fun with your domain, then: sudo certbot --nginx -d gravekeeper.fun
# The website is the static build in dist/; /api goes to the bot on 127.0.0.1:5016.

server {
    listen 80;
    listen [::]:80;
    server_name gravekeeper.fun;

    root /home/gravekeeper/gravekeeper/dist;
    index index.html;

    # the bot's API (status for the site, admin for /memex)
    location /api/ {
        proxy_pass http://127.0.0.1:5016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    # note: add_header in a location replaces every add_header above it, so each location lists all of its own

    # hashed build files: cache for a long time
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # single-page app: /memex and every other route serve index.html (never cached)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

}
